<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
  <title id="title">Настройки form action DOIConfirmBundle</title>
  <desc id="desc">Схематичная карточка полей действия формы DOIConfirmBundle с обязательными и опциональными настройками.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fa; }
      .panel { fill: #ffffff; stroke: #9aabb4; stroke-width: 2; rx: 8; }
      .field { fill: #ffffff; stroke: #c8d3d8; stroke-width: 1.5; rx: 5; }
      .field-fill { fill: #eef7f1; stroke: #79a985; stroke-width: 1.5; rx: 5; }
      .note { fill: #fff7e8; stroke: #d19a3c; stroke-width: 1.5; rx: 5; }
      .title { font: 700 24px Arial, sans-serif; fill: #17313b; }
      .section { font: 700 17px Arial, sans-serif; fill: #17313b; }
      .label { font: 14px Arial, sans-serif; fill: #253f49; }
      .mono { font: 14px Consolas, monospace; fill: #284a5a; }
      .small { font: 12px Arial, sans-serif; fill: #526a74; }
      .required { font: 700 12px Arial, sans-serif; fill: #8a3b12; }
      .ok { font: 700 12px Arial, sans-serif; fill: #2f6b3d; }
    </style>
  </defs>
  <rect class="bg" width="1080" height="650"/>
  <rect class="panel" x="60" y="54" width="960" height="540"/>
  <text class="title" x="94" y="96">Form action: Double-Opt-In via Email Confirmation</text>
  <text class="small" x="94" y="122">Схема полей в Mautic 7.1.3. Если UI отличается, ищите действие по label jw.mautic.email.form.action.sendemail.lead.</text>

  <text class="section" x="94" y="168">Email</text>
  <rect class="field-fill" x="94" y="186" width="410" height="58"/>
  <text class="label" x="116" y="218">Email to send</text>
  <text class="required" x="408" y="218">required</text>
  <text class="small" x="116" y="236">В выбранном email должен быть токен {doi_url}.</text>

  <rect class="note" x="560" y="186" width="390" height="58"/>
  <text class="label" x="582" y="218">В контенте письма</text>
  <text class="mono" x="716" y="218">{doi_url}</text>
  <text class="mono" x="816" y="218">{doi_nothuman}</text>
  <text class="small" x="582" y="236">{doi_nothuman} только для скрытой/нечеловеческой ссылки.</text>

  <text class="section" x="94" y="286">Success actions после подтверждения</text>
  <rect class="field" x="94" y="306" width="410" height="48"/>
  <text class="label" x="116" y="335">Tags to add / Tags to remove</text>
  <rect class="field" x="540" y="306" width="410" height="48"/>
  <text class="label" x="562" y="335">Segments to add / Segments to remove</text>

  <rect class="field" x="94" y="374" width="410" height="48"/>
  <text class="label" x="116" y="403">Update contact fields after DOI</text>
  <rect class="field" x="540" y="374" width="410" height="48"/>
  <text class="label" x="562" y="403">Update contact fields before DOI email</text>

  <text class="section" x="94" y="466">Redirect and email source</text>
  <rect class="field-fill" x="94" y="486" width="410" height="58"/>
  <text class="label" x="116" y="518">Redirect URL after success</text>
  <text class="required" x="390" y="518">required</text>
  <text class="small" x="116" y="536">Можно использовать токены формы/контакта.</text>

  <rect class="field" x="540" y="486" width="410" height="58"/>
  <text class="label" x="562" y="518">Alternative email field alias</text>
  <text class="ok" x="820" y="518">optional</text>
  <text class="small" x="562" y="536">Fallback, если у контакта нет email.</text>
</svg>
